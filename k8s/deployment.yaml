
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp197-api
  labels:
    app: mp197-api

spec:
  replicas: 4

  selector:
    matchLabels:
      app: mp197-api

  template:
    metadata:
      labels:
        app: mp197-api

    spec:
      containers:
        - name: mp197-api
          image: mp197-api:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
